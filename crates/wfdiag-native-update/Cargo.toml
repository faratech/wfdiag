[package]
name = "wfdiag-native-update"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "UI-framework-neutral GitHub update service and worker for WFDiag"
license-file = "../../LICENSE"
publish = false

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.0", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
] }

[dev-dependencies]
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
