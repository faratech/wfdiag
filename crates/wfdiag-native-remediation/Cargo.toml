[package]
name = "wfdiag-native-remediation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "UI-framework-neutral remediation execution: the vetted tiered catalog, injectable command runner, and confirm gate shared by both WFDiag shells"
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["process", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
wfdiag-native-issues = { workspace = true }
wfdiag-remediation-catalog = { workspace = true }

[target.'cfg(windows)'.dependencies]
encoding_rs = { workspace = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
