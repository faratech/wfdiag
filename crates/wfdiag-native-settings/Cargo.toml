[package]
name = "wfdiag-native-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Framework-neutral settings and credential command seam for WFDiag UI shells"
license-file.workspace = true
publish.workspace = true

[dependencies]
dirs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Wipes decrypted API-key bytes/strings from memory as soon as they go out of
# scope (#218).
zeroize = { workspace = true, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
