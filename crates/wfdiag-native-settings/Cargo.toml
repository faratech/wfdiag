[package]
name = "wfdiag-native-settings"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Framework-neutral settings and credential command seam for WFDiag UI shells"
license-file = "../../LICENSE"
publish = false

[dependencies]
dirs = "6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
