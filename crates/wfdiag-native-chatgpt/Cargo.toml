[package]
name = "wfdiag-native-chatgpt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Native ChatGPT authorization, protected accounts, and renewable sessions"

[dependencies]
base64.workspace = true
getrandom.workspace = true
jsonwebtoken.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "form", "native-tls", "stream"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tokio-util.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
zeroize = { workspace = true, features = ["alloc", "derive"] }
wfdiag-native-settings.workspace = true

[lints]
workspace = true
