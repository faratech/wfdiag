[package]
name = "wfdiag-native-issues"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "UI-framework-neutral issue detection runtime for WFDiag"
license-file = "../../LICENSE"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0"
wfdiag-remediation-catalog = { path = "../wfdiag-remediation-catalog" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
