[package]
name = "wfdiag-ui-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Framework-neutral UI event contracts and delivery bus for WFDiag"
license-file = "../../LICENSE"

[dependencies]
event-listener = "5.4.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
wfdiag-native-issues = { path = "../wfdiag-native-issues" }
wfdiag-remediation-catalog = { path = "../wfdiag-remediation-catalog" }

[dev-dependencies]
serde_json = "1.0.145"
tokio = { version = "1.52.0", features = ["macros", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
