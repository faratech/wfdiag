[package]
name = "wfdiag-native-export"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "UI-framework-neutral diagnostic export generation for WFDiag"
license-file.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive", "rc"] }
# Shipping enables preserve_order transitively. Make it explicit here so a
# standalone native shell preserves JSON object field order byte-for-byte.
serde_json = { workspace = true, features = ["preserve_order"] }
wfdiag-native-issues = { workspace = true }

[lints]
workspace = true
