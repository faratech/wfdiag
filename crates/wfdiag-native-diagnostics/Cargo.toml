[package]
name = "wfdiag-native-diagnostics"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Tauri-independent native Windows diagnostics runtime for WFDiag UI shells"
license-file = "../../LICENSE"
publish = false

[dependencies]
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.52.0", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1.20.0", features = ["v4"] }
wfdiag-ui-core = { path = "../wfdiag-ui-core" }
wfdiag-native-issues = { path = "../wfdiag-native-issues" }

[target.'cfg(windows)'.dependencies]
anyhow = "1.0"
dirs = "6.0"
encoding_rs = "0.8"
serde_json = "1.0.145"
thiserror = "2.0"
wfdiag-native-monitor = { path = "../wfdiag-native-monitor" }
winreg = "0.56"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
