[package]
name = "wfdiag-native-diagnostics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Tauri-independent native Windows diagnostics runtime for WFDiag UI shells"
license-file.workspace = true
publish.workspace = true

[dependencies]
futures = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
wfdiag-ui-core = { workspace = true }
wfdiag-native-issues = { workspace = true }

[target.'cfg(windows)'.dependencies]
anyhow = { workspace = true }
dirs = { workspace = true }
encoding_rs = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wfdiag-native-monitor = { workspace = true }
winreg = { workspace = true }
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
