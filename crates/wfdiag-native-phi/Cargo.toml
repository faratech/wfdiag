[package]
name = "wfdiag-native-phi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "UI-framework-neutral Windows AI/Phi Silica runtime for WFDiag"
license-file.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
wfdiag-native-ai-chat = { workspace = true }
wfdiag-native-ai-provider = { workspace = true }
wfdiag-native-settings = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-core = "0.62"
windows-future = "0.3"
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
] }

[lints]
workspace = true
