[package]
name = "wfdiag-native-history"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "UI-framework-neutral encrypted scan history and Tokio runtime for WFDiag"
license-file = "../../LICENSE"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.145"
thiserror = "2.0"
tokio = { version = "1.52.0", features = ["rt", "sync", "time"] }
wfdiag-native-issues = { path = "../wfdiag-native-issues" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
