[package]
name = "wfdiag-native-ai-report"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "UI-framework-neutral one-click AI scan report service for WFDiag"
license-file = "../../LICENSE"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1.20.0", features = ["v4"] }
wfdiag-native-ai-chat = { path = "../wfdiag-native-ai-chat" }
wfdiag-native-ai-provider = { path = "../wfdiag-native-ai-provider" }
wfdiag-native-history = { path = "../wfdiag-native-history" }
wfdiag-native-issues = { path = "../wfdiag-native-issues" }

[dev-dependencies]
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
