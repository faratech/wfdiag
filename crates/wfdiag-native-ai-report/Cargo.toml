[package]
name = "wfdiag-native-ai-report"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "UI-framework-neutral one-click AI scan report service for WFDiag"
license-file.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
wfdiag-native-ai-chat = { workspace = true }
wfdiag-native-ai-provider = { workspace = true }
wfdiag-native-history = { workspace = true }
wfdiag-native-issues = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
