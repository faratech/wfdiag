[package]
name = "wfdiag-native-ai-chat"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "UI-framework-neutral AI chat state, tool loop, and wire contracts for WFDiag"
license-file = "../../LICENSE"
publish = false

[dependencies]
# Shared chat-completions client for the OpenAI-compatible providers
async-openai = { version = "0.41", default-features = false, features = ["native-tls", "chat-completion"] }
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
wfdiag-native-ai-provider = { path = "../wfdiag-native-ai-provider" }

[dev-dependencies]
serde_json = "1.0.145"
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
