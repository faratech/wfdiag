[package]
name = "wfdiag-native-ai-chat"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "UI-framework-neutral AI chat state, tool loop, and wire contracts for WFDiag"
license-file = "../../LICENSE"
publish = false

[dependencies]
# Shared chat-completions client for the OpenAI-compatible providers
agent-client-protocol = "1"
async-openai = { version = "0.41", default-features = false, features = ["native-tls", "chat-completion"] }
dirs = "6.0"
eventsource-stream = "0.2"
futures = "0.3"
process-wrap = { version = "10.0.0", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-session", "tokio1"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
wfdiag-native-ai-provider = { path = "../wfdiag-native-ai-provider" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1.0.145"
wfdiag-native-settings = { path = "../wfdiag-native-settings" }
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
