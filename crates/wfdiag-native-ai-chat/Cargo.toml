[package]
name = "wfdiag-native-ai-chat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "UI-framework-neutral AI chat state, tool loop, and wire contracts for WFDiag"
license-file.workspace = true
publish.workspace = true

[dependencies]
# Shared chat-completions client for the OpenAI-compatible providers
agent-client-protocol = { workspace = true }
async-openai = { workspace = true, features = ["native-tls", "chat-completion"] }
dirs = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
process-wrap = { workspace = true, features = ["creation-flags", "job-object", "kill-on-drop", "process-session", "tokio1"] }
reqwest = { workspace = true, features = ["json", "native-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
wfdiag-native-ai-provider = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
serde_json = { workspace = true }
wfdiag-native-settings = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
