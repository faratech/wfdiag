[package]
name = "wfdiag-native-ai-provider"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "UI-framework-neutral AI provider status and management service for WFDiag"
license-file.workspace = true
publish.workspace = true

[dependencies]
reqwest = { workspace = true, features = ["json", "native-tls", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "rt", "sync", "time"] }
url = { workspace = true }
wfdiag-native-settings = { workspace = true }

[target.'cfg(windows)'.dependencies]
dirs = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
