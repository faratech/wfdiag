name: CodeQL

on:
  schedule:
    - cron: '13 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The weekly scan is the only automated one - never cancel it (or a manual
  # dispatch) mid-flight; a duplicate run merely queues.
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze CodeQL languages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: actions,javascript-typescript,python,rust
          build-mode: none
      - uses: github/codeql-action/analyze@v3
