name: Windows Certificate Signing

on:
  workflow_dispatch:
  push:
    paths:
      - 'releases/**'

permissions:
  contents: read

jobs:
  windows-sign:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup certificate
      env:
        CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      shell: pwsh
      run: |
        if ([string]::IsNullOrEmpty($env:CERTIFICATE_BASE64)) {
          Write-Host "Certificate secrets not found - skipping Windows signing" -ForegroundColor Yellow
          echo "SKIP_SIGNING=true" >> $env:GITHUB_ENV
          exit 0
        }
        
        Write-Host "Setting up certificate..." -ForegroundColor Cyan
        $certBytes = [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
        [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
        echo "SKIP_SIGNING=false" >> $env:GITHUB_ENV

    - name: Sign executables
      if: env.SKIP_SIGNING == 'false'
      env:
        CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      shell: pwsh
      run: |
        Write-Host "Finding executables to sign..." -ForegroundColor Cyan
        
        $files = Get-ChildItem -Recurse -Include "*.exe" | Where-Object { 
          $_.Name -notlike "*build*" -and 
          $_.Directory.Name -ne "node_modules" 
        }
        
        foreach ($file in $files) {
          Write-Host "Signing: $($file.Name)" -ForegroundColor Yellow
          
          # Find signtool
          $signtool = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe",
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22000.0\x64\signtool.exe",
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          
          if ($signtool) {
            try {
              # Try with timestamp
              & $signtool sign /f "cert.pfx" /p $env:CERTIFICATE_PASSWORD /fd sha256 /tr "http://timestamp.digicert.com" /td sha256 /d "WindowsForum Diagnostic Tool" $file.FullName
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ Signed with timestamp: $($file.Name)" -ForegroundColor Green
              } else {
                # Fallback without timestamp
                & $signtool sign /f "cert.pfx" /p $env:CERTIFICATE_PASSWORD /fd sha256 /d "WindowsForum Diagnostic Tool" $file.FullName
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "✅ Signed (no timestamp): $($file.Name)" -ForegroundColor Green
                } else {
                  Write-Host "❌ Failed to sign: $($file.Name)" -ForegroundColor Red
                }
              }
            } catch {
              Write-Host "❌ Error signing $($file.Name): $_" -ForegroundColor Red
            }
          } else {
            Write-Host "❌ signtool not found" -ForegroundColor Red
          }
        }

    - name: Verify signatures
      if: env.SKIP_SIGNING == 'false'
      shell: pwsh
      run: |
        Write-Host "Verifying signatures..." -ForegroundColor Cyan
        
        $files = Get-ChildItem -Recurse -Include "*.exe" | Where-Object { 
          $_.Name -notlike "*build*" -and 
          $_.Directory.Name -ne "node_modules" 
        }
        
        foreach ($file in $files) {
          try {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status)" -ForegroundColor $(if ($sig.Status -eq 'Valid' -or $sig.Status -eq 'UnknownError') { 'Green' } else { 'Yellow' })
          } catch {
            Write-Host "$($file.Name): Could not verify" -ForegroundColor Red
          }
        }

    - name: Upload signed files
      if: env.SKIP_SIGNING == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: windows-signed-executables
        path: |
          **/*.exe
          !node_modules/**
          !**/build/**
          !**/target/debug/**
        retention-days: 90