name: Build and Publish to Microsoft Store

# Trigger on version tags (e.g., v2.1.6)
# All version tags will build, create release, AND publish to Microsoft Store
#
# Manual dispatch is available for testing without creating tags. The
# packaged product is the native WinUI 3 shell (apps/wfdiag, wfdiag.exe,
# framework-dependent on Microsoft.WindowsAppRuntime.2). The package
# manifest, layout, and MSIX contract come from
# scripts/build-reactor-msix-probe.py so the shipped package and the probe
# can never disagree.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # e.g., v2.1.6
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 2.1.5)'
        required: true
      publish_to_store:
        description: 'Publish to Microsoft Store'
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: WindowsForum_Diagnostics
  PUBLISHER: CN=ABDB6B3F-DF9E-447D-BC0E-4DA7BAFD14C4

# Default to minimal permissions
permissions:
  contents: read

concurrency:
  group: build-publish-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =============================================================================
  # Build x64 executable
  # =============================================================================
  build-x64:
    runs-on: windows-latest
    env:
      __COMPAT_LAYER: RunAsInvoker
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_to_store: ${{ steps.version.outputs.publish_to_store }}
      create_release: ${{ steps.version.outputs.create_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and release type
        id: version
        shell: pwsh
        run: |
          $publishToStore = "false"
          $createRelease = "false"

          if ("${{ github.event.inputs.version }}" -ne "") {
            # Manual dispatch
            $version = "${{ github.event.inputs.version }}"
            $publishToStore = "${{ github.event.inputs.publish_to_store }}"
            $createRelease = "${{ github.event.inputs.create_release }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            # Tag push - always create release and publish to store
            $tagName = "${{ github.ref_name }}"
            $version = $tagName.TrimStart('v')
            $createRelease = "true"
            $publishToStore = "true"
            Write-Host "Tag release detected: $tagName"
          } else {
            $version = (Get-Content version.json | ConvertFrom-Json).version
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::Version must be X.Y.Z without a leading v; got '$version'."
            exit 1
          }

          # The publish-to-store job depends on create-release succeeding —
          # requesting a store publish without a release silently no-ops
          # both downstream jobs (create-release is skipped, which is not
          # "success", so publish-to-store's condition never passes either)
          # while the rest of the run still shows green. Fail loudly instead.
          if ($publishToStore -eq "true" -and $createRelease -ne "true") {
            Write-Host "::error::publish_to_store=true requires create_release=true (Store publish runs only after the GitHub Release is created)."
            exit 1
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "publish_to_store=$publishToStore" >> $env:GITHUB_OUTPUT
          echo "create_release=$createRelease" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"
          Write-Host "Publish to store: $publishToStore"
          Write-Host "Create release: $createRelease"

      - name: Verify source and requested versions match
        run: python scripts/check-version-sync.py --expected "${{ steps.version.outputs.version }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: x64

      - name: Build native shell (x64)
        # Framework-dependent: no app-local bootstrap DLL; Reactor uses OS package-dependency APIs.
        run: cargo build --locked --release -p wfdiag --target x86_64-pc-windows-msvc

      - name: Upload native payload (x64)
        uses: actions/upload-artifact@v4
        with:
          name: exe-x64
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/wfdiag.exe

  # =============================================================================
  # Build ARM64 executable
  # =============================================================================
  build-arm64:
    runs-on: windows-latest
    env:
      __COMPAT_LAYER: RunAsInvoker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: arm64

      - name: Check ARM64 build tools
        shell: pwsh
        run: |
          # GitHub-hosted runners should have ARM64 tools pre-installed
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS Path: $vsPath"

          # Find ARM64 tools
          $arm64Paths = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\arm64" -ErrorAction SilentlyContinue
          if ($arm64Paths) {
            Write-Host "ARM64 build tools found:"
            $arm64Paths | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "::warning::ARM64 build tools not found in default location"
            # List what's available
            Write-Host "Available MSVC tools:"
            Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
          }

      - name: Build native shell (ARM64)
        run: cargo build --locked --release -p wfdiag --target aarch64-pc-windows-msvc

      - name: Upload native payload (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: exe-arm64
          if-no-files-found: error
          path: |
            target/aarch64-pc-windows-msvc/release/wfdiag.exe

  # =============================================================================
  # Create MSIX Bundle (probe-rendered manifest + executable)
  # =============================================================================
  create-msix-bundle:
    needs: [build-x64, build-arm64]
    runs-on: windows-latest
    outputs:
      bundle_path: ${{ steps.bundle-native.outputs.bundle_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Download x64 executable
        uses: actions/download-artifact@v4
        with:
          name: exe-x64
          path: artifacts/x64

      - name: Download ARM64 executable
        uses: actions/download-artifact@v4
        with:
          name: exe-arm64
          path: artifacts/arm64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stage, pack, and bundle the native Store packages
        id: bundle-native
        shell: pwsh
        run: |
          $version = "${{ needs.build-x64.outputs.version }}"
          $projectName = "${{ env.PROJECT_NAME }}"
          $probe = "scripts/build-reactor-msix-probe.py"
          New-Item -ItemType Directory -Force -Path msix-build/bundle | Out-Null

          foreach ($arch in @("x64", "arm64")) {
            Write-Host "`n=== ${arch}: stage layout ==="
            python $probe stage --target $arch `
              --executable "artifacts/$arch/wfdiag.exe" `
              --output msix-build
            if ($LASTEXITCODE -ne 0) { throw "staging the $arch layout failed" }

            Write-Host "=== ${arch}: pack ==="
            python $probe pack --target $arch `
              --layout "msix-build/layout-$arch" `
              --package "msix-build/bundle/${projectName}_${version}_$arch.msix"
            if ($LASTEXITCODE -ne 0) { throw "packing the $arch MSIX failed" }
          }

          $bundlePath = "msix-build/${projectName}_${version}.msixbundle"
          python $probe bundle --packages-dir msix-build/bundle --bundle $bundlePath
          if ($LASTEXITCODE -ne 0) { throw "bundling failed" }
          Write-Host "`nBundle created: $bundlePath"
          echo "bundle_path=$bundlePath" >> $env:GITHUB_OUTPUT

      - name: Validate native Store bundle contents
        shell: pwsh
        run: |
          $version = "${{ needs.build-x64.outputs.version }}"
          $bundle = "msix-build/${{ env.PROJECT_NAME }}_${version}.msixbundle"
          if (-not (Test-Path $bundle)) { throw "Bundle not found: $bundle" }

          $sdkPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" -Directory |
                     Sort-Object Name -Descending |
                     Select-Object -First 1
          $makeAppx = Join-Path $sdkPath.FullName "x64\MakeAppx.exe"
          $inspectRoot = "msix-build/inspect"
          Remove-Item $inspectRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$inspectRoot/bundle" | Out-Null

          & $makeAppx unbundle /p $bundle /d "$inspectRoot/bundle" /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx could not unpack the bundle" }

          $packages = @(Get-ChildItem "$inspectRoot/bundle" -Filter "*.msix")
          if ($packages.Count -ne 2) {
            throw "Expected two architecture packages; found $($packages.Count)"
          }

          $foundArchitectures = @()
          foreach ($package in $packages) {
            $arch = if ($package.BaseName -like "*_arm64") { "arm64" } elseif ($package.BaseName -like "*_x64") { "x64" } else { throw "$($package.Name): cannot infer architecture" }
            # The probe contract checks identity, capabilities (incl. systemAIModels),
            # the WindowsAppRuntime.2 dependency, the exact payload set (no app-local
            # runtime or AI DLLs), PE architecture, and the absence of app-local DLLs.
            python scripts/build-reactor-msix-probe.py validate-msix --target $arch $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($package.Name) failed the MSIX contract" }

            $unpacked = Join-Path $inspectRoot $package.BaseName
            New-Item -ItemType Directory -Force -Path $unpacked | Out-Null
            & $makeAppx unpack /p $package.FullName /d $unpacked /o
            if ($LASTEXITCODE -ne 0) { throw "Could not unpack $($package.Name)" }
            [xml]$manifest = Get-Content -Raw (Join-Path $unpacked "AppxManifest.xml")
            $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
            if ($identity.GetAttribute("Version") -ne "$version.0") {
              throw "$($package.Name): version '$($identity.GetAttribute('Version'))' does not match '$version.0'"
            }
            $foundArchitectures += $identity.GetAttribute("ProcessorArchitecture")
          }

          $architectureSet = @($foundArchitectures | Sort-Object -Unique) -join ','
          if ($architectureSet -ne 'arm64,x64') {
            throw "Bundle architectures are '$($foundArchitectures -join ',')', expected x64 and arm64"
          }
          Write-Host "Validated native Store identity, capabilities, WindowsAppRuntime.2 dependency, payload, and both architectures."

      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: msixbundle-unsigned
          path: msix-build/*.msixbundle

  # =============================================================================
  # Publish to Microsoft Store (triggers separate workflow after release)
  # =============================================================================
  publish-to-store:
    needs: [build-x64, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    if: needs.build-x64.outputs.publish_to_store == 'true' && needs.create-release.result == 'success'
    steps:
      - name: Trigger Store publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-x64.outputs.version }}"
          echo "Triggering publish-existing-to-store workflow for v$VERSION..."
          gh workflow run publish-existing-to-store.yml \
            --repo ${{ github.repository }} \
            -f version="$VERSION"
          echo "Store publish workflow triggered successfully"

  # =============================================================================
  # Generate Attestations for all artifacts
  # =============================================================================
  attest-artifacts:
    needs: [build-x64, build-arm64, create-msix-bundle]
    if: needs.build-x64.result == 'success' && needs.build-arm64.result == 'success' && needs.create-msix-bundle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.exe" -o -name "*.msixbundle" | head -20

      - name: Attest x64 executable
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/exe-x64/*.exe

      - name: Attest ARM64 executable
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/exe-arm64/*.exe

      - name: Attest MSIX bundle
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/msixbundle-unsigned/*.msixbundle

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  create-release:
    needs: [build-x64, create-msix-bundle, attest-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.build-x64.result == 'success' && needs.create-msix-bundle.result == 'success' && needs.build-x64.outputs.create_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download MSIX bundle
        uses: actions/download-artifact@v4
        with:
          name: msixbundle-unsigned
          path: release

      - name: Download x64 executable
        uses: actions/download-artifact@v4
        with:
          name: exe-x64
          path: release/exe-x64

      - name: Download ARM64 executable
        uses: actions/download-artifact@v4
        with:
          name: exe-arm64
          path: release/exe-arm64

      - name: Prepare release files
        run: |
          cd release
          VERSION="${{ needs.build-x64.outputs.version }}"

          for ARCH in x64 arm64; do
            if [ -f "exe-$ARCH/wfdiag.exe" ]; then
              # Native shell: framework-dependent, so the download is the exe
              # plus instructions for installing the shared runtime.
              cat > "exe-$ARCH/README.txt" <<'NOTE'
          WindowsForum Diagnostics (native shell, framework-dependent build)

          No app-local bootstrap DLL is required. The matching Windows App
          Runtime 2.x framework must be installed:
          https://aka.ms/windowsappsdk/2.4/latest/windowsappruntimeinstall-x64.exe
          https://aka.ms/windowsappsdk/2.4/latest/windowsappruntimeinstall-arm64.exe
          The Microsoft Store package installs it for you.
          NOTE
              (cd "exe-$ARCH" && zip -q "../WindowsForum_Diagnostics_${VERSION}_${ARCH}.zip" wfdiag.exe README.txt)
          done

          # Clean up staging directories
          rm -rf exe-x64 exe-arm64

          ls -la

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${{ needs.build-x64.outputs.version }}"
          TAG="v${VERSION}"
          git fetch --force --tags

          TAG_NOTES="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:body)')"
          if [ -z "${TAG_NOTES//[[:space:]]/}" ]; then
            TAG_NOTES="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)')"
          fi

          {
            echo "## WindowsForum Diagnostics v${VERSION}"
            echo
            if [ -n "${TAG_NOTES//[[:space:]]/}" ]; then
              echo "### Changelog"
              echo
              printf '%s\n' "$TAG_NOTES"
              echo
            fi
            echo "### Recommended Installation"
            echo "**[Get from Microsoft Store](https://apps.microsoft.com/detail/9nj59rh053pv)** - Signed by Microsoft, automatic updates"
            echo
            echo "### Alternative Downloads"
            echo "- **MSIX Bundle**: Unsigned Store-submission artifact; it is not directly installable"
            echo "- **Zip (x64 / ARM64)**: wfdiag.exe and runtime setup instructions; requires the Windows App Runtime 2.x framework (see README.txt inside)"
          } > release/RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-x64.outputs.version }}
          name: WindowsForum Diagnostics v${{ needs.build-x64.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release/*.msixbundle
            release/*.exe
            release/*.zip
          body_path: release/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
