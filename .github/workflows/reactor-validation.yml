# Reactor validation lane: clean x64 and ARM64 Windows runners.
#
# Manual dispatch builds the native WinUI candidate (release, self-contained)
# for each architecture on a clean hosted runner and runs the live-system +
# flow validation scripts against it. The hermetic AI suite is release-gating:
# it owns its provider and settings and must complete chat, cancel,
# exact-ten tool-contract, native-catalog, report, and forced-regeneration
# flows. Shared chat tests pin the closed parser; shared report tests
# separately pin cache hits and full-body rehydration. Hardware/live-provider
# suites remain informational while hosted-runner UIA stability is still
# being proven. The ARM64 leg is best-effort until the hosted ARM64 runner
# image has been validated for WinUI (continue-on-error).
#
# Evidence (logs + captures) is uploaded as workflow artifacts.

name: reactor-validation

on:
  workflow_dispatch:
    inputs:
      run-ui-suites:
        description: "Run the UIA flow suites (experimental on runners)"
        type: boolean
        default: true
      run-external-gates:
        description: "Run the external-gates watcher"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            best-effort: false
          - arch: arm64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
            best-effort: true
    name: validate-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.best-effort }}
    timeout-minutes: 90
    env:
      EXE: target\${{ matrix.triple }}\release\wfdiag.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.triple }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test hermetic AI engine and report cache
        run: |
          cargo test --locked -p wfdiag-native-ai-chat --all-targets
          cargo test --locked -p wfdiag-native-ai-report --all-targets

      - name: Build self-contained validation candidate (release)
        run: cargo build --locked --release -p wfdiag --target ${{ matrix.triple }} --features self-contained,settings-test-path

      - name: Version probe
        shell: pwsh
        run: |
          $env:WFDIAG_REACTOR_VERSION_PROBE_FILE = "${{ runner.temp }}\version.json"
          & $env:EXE --wfdiag-version-probe
          if ($LASTEXITCODE -ne 0) { throw "version probe failed" }
          Get-Content $env:WFDIAG_REACTOR_VERSION_PROBE_FILE

      - name: Hermetic AI flow validation
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-ai-flows.ps1 `
            -Executable $env:EXE `
            -OutputDirectory "validation-reports\ai-flows"

      - name: Live-system validation
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-live-system.ps1 `
            -Executable $env:EXE `
            -OutputDirectory "validation-reports\live-system" `
            -HoldSeconds 2

      - name: Chat flow validation
        if: ${{ inputs.run-ui-suites }}
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-chat.ps1 `
            -Executable $env:EXE `
            -OutputDirectory "validation-reports\chat"

      - name: Report flow validation
        if: ${{ inputs.run-ui-suites }}
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-report.ps1 `
            -Executable $env:EXE `
            -OutputDirectory "validation-reports\report" `
            -ScanWaitSeconds 300

      - name: Remediation flow validation
        if: ${{ inputs.run-ui-suites }}
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-remediation.ps1 `
            -Executable $env:EXE `
            -OutputDirectory "validation-reports\remediation" `
            -ScanWaitSeconds 300

      - name: External gates watcher
        if: ${{ inputs.run-external-gates && matrix.arch == 'x64' }}
        shell: pwsh
        run: |
          python scripts/check-external-gates.py --json
          # Informational: actionable findings are reviewed, not gating.

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactor-validation-evidence-${{ matrix.arch }}
          path: |
            validation-reports/
            apps/wfdiag/captures-2.5.8/validation-*/
          if-no-files-found: warn
