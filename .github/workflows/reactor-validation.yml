# Reactor validation lane: clean x64 Windows runner.
#
# Manual dispatch (plus an optional weekly schedule) builds the native
# WinUI candidate for x64 on a clean windows-latest runner and runs the
# live-system + flow validation scripts against it. The hermetic AI suite is
# release-gating: it owns its provider and settings and must complete chat,
# cancel, exact-ten tool-contract, native-catalog, report, and
# forced-regeneration flows. Shared chat tests pin the closed parser; shared
# report tests separately pin cache hits and full-body rehydration.
# Hardware/live-provider suites remain informational while hosted-runner UIA
# stability is still being proven.
#
# Evidence (logs + captures) is uploaded as workflow artifacts.

name: reactor-validation

on:
  workflow_dispatch:
    inputs:
      run-ui-suites:
        description: "Run the UIA flow suites (experimental on runners)"
        type: boolean
        default: true
      run-external-gates:
        description: "Run the external-gates watcher"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test hermetic AI engine and report cache
        run: |
          cargo test --locked --manifest-path crates/wfdiag-native-ai-chat/Cargo.toml --all-targets
          cargo test --locked --manifest-path crates/wfdiag-native-ai-report/Cargo.toml --all-targets

      - name: Build self-contained validation candidate
        run: cargo build --locked --target x86_64-pc-windows-msvc --features self-contained,settings-test-path --manifest-path apps/wfdiag/Cargo.toml

      - name: Version probe
        shell: pwsh
        run: |
          $exe = "target\x86_64-pc-windows-msvc\debug\wfdiag.exe"
          $env:WFDIAG_REACTOR_VERSION_PROBE_FILE = "${{ runner.temp }}\version.json"
          & $exe --wfdiag-version-probe
          if ($LASTEXITCODE -ne 0) { throw "version probe failed" }
          Get-Content $env:WFDIAG_REACTOR_VERSION_PROBE_FILE

      - name: Hermetic AI flow validation
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-ai-flows.ps1 `
            -Executable "target\x86_64-pc-windows-msvc\debug\wfdiag.exe" `
            -OutputDirectory "validation-reports\ai-flows"

      - name: Live-system validation
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-live-system.ps1 `
            -Executable "target\x86_64-pc-windows-msvc\debug\wfdiag.exe" `
            -OutputDirectory "validation-reports\live-system" `
            -HoldSeconds 2

      - name: Chat flow validation
        if: ${{ inputs.run-ui-suites }}
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-chat.ps1 `
            -Executable "target\x86_64-pc-windows-msvc\debug\wfdiag.exe" `
            -OutputDirectory "validation-reports\chat"

      - name: Report flow validation
        if: ${{ inputs.run-ui-suites }}
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-report.ps1 `
            -Executable "target\x86_64-pc-windows-msvc\debug\wfdiag.exe" `
            -OutputDirectory "validation-reports\report" `
            -ScanWaitSeconds 300

      - name: Remediation flow validation
        if: ${{ inputs.run-ui-suites }}
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-reactor-remediation.ps1 `
            -Executable "target\x86_64-pc-windows-msvc\debug\wfdiag.exe" `
            -OutputDirectory "validation-reports\remediation" `
            -ScanWaitSeconds 300

      - name: External gates watcher
        if: ${{ inputs.run-external-gates }}
        shell: pwsh
        run: |
          python scripts/check-external-gates.py --json
          # Informational: actionable findings are reviewed, not gating.

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactor-validation-evidence
          path: |
            validation-reports/
            apps/wfdiag/captures-2.5.8/validation-*/
          if-no-files-found: warn
