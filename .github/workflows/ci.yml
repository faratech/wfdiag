name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'validation-reports/**'
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-identity:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-version-sync.py
      - run: python3 scripts/check-store-identity.py
      - run: python3 -m unittest scripts/test_build_reactor_msix_probe.py -v

  frontend:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust-portable:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # The engine crates must build and test with no GUI and no Windows: this
    # job is the headless guarantee. Only the two shells (WinUI / Tauri) are
    # excluded; wfdiag-native-monitor compiles to an empty library off-Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: portable
      - run: cargo check --locked --workspace --all-targets --exclude wfdiag --exclude wfdiag-tauri
      - run: cargo clippy --locked --workspace --all-targets --exclude wfdiag --exclude wfdiag-tauri -- -D warnings
      - run: cargo test --locked --workspace --exclude wfdiag --exclude wfdiag-tauri

  rust:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Windows: the whole workspace (engine crates, native Reactor shell, and the
    # Tauri rollback shell) formats, lints, and tests together.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      __COMPAT_LAYER: RunAsInvoker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # tauri-build embeds ../dist via the default custom-protocol feature and
      # dist/ is untracked, so the frontend must be built first
      - run: npm run build
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features wfdiag/validation -- -D warnings
      - run: cargo test --locked --workspace --features wfdiag/validation
      # Release shape: no wfdiag features at all. This is what actually ships,
      # and it is the only configuration in which the shell's
      # `production_defaults` knob test compiles (#186, #212) — without this
      # step nothing would ever prove the fixture/env knobs are absent.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked -p wfdiag

  rust-arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      __COMPAT_LAYER: RunAsInvoker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-arm64
      - run: cargo check --locked --workspace --all-targets --features wfdiag/validation --target aarch64-pc-windows-msvc
      - run: cargo clippy --locked --workspace --all-targets --features wfdiag/validation --target aarch64-pc-windows-msvc -- -D warnings

  cargo-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # advisory for one release; covers the whole workspace lock
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
