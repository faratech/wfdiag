name: CI

on:
  # No branch filter on pull_request: stacked PRs (feature -> feature) must
  # run the same gates as PRs into main — cargo test only ever executes on
  # windows-latest for the shells; the engine crates also test on Linux.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-version-sync.py
      - run: python3 scripts/check-store-identity.py
      - run: python3 -m unittest scripts/test_build_reactor_msix_probe.py -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust-portable:
    # The engine crates must build and test with no GUI and no Windows: this
    # job is the headless guarantee. Only the two shells (WinUI / Tauri) are
    # excluded; wfdiag-native-monitor compiles to an empty library off-Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: portable
      - run: cargo check --locked --workspace --all-targets --exclude wfdiag --exclude wfdiag-tauri
      - run: cargo clippy --locked --workspace --all-targets --exclude wfdiag --exclude wfdiag-tauri -- -D warnings
      - run: cargo test --locked --workspace --exclude wfdiag --exclude wfdiag-tauri

  rust:
    # Windows: the whole workspace (engine crates, native Reactor shell, and the
    # Tauri rollback shell) formats, lints, and tests together.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # tauri-build embeds ../dist via the default custom-protocol feature and
      # dist/ is untracked, so the frontend must be built first
      - run: npm run build
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features wfdiag/settings-test-path -- -D warnings
      - run: cargo test --locked --workspace --features wfdiag/settings-test-path

  rust-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-arm64
      - run: cargo check --locked --workspace --all-targets --features wfdiag/settings-test-path --target aarch64-pc-windows-msvc
      - run: cargo clippy --locked --workspace --all-targets --features wfdiag/settings-test-path --target aarch64-pc-windows-msvc -- -D warnings

  cargo-audit:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory for one release; covers the whole workspace lock
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
