name: Update Store Screenshots

# Replaces the "Screenshot"-type listing images on the Store listing with the
# PNGs committed under store-assets/screenshots/. Every other image type
# (Icon, StoreLogo*, PromotionalArt*, …) is left untouched.
#
# Talks to the documented Microsoft Store submission REST API directly
# (manage.devcenter.microsoft.com/v1.0) instead of the msstore CLI: the CLI
# wrapper hides real HTTP errors behind a bare "Error!" and repeatedly died
# on transient Partner Center 504s, while direct REST calls (same auth as
# check-store-submission.yml) kept working. Flow per the docs
# (learn.microsoft.com/windows/uwp/monetize/manage-app-submissions):
#   1. GET the app → use the pending submission if one exists, else POST
#      /submissions to create one (server-side clone of the last published).
#   2. Patch the listing's images array: keep non-Screenshot entries, add
#      the new files as fileStatus=PendingUpload / imageType=Screenshot.
#   3. PUT the full submission JSON back (the API replaces, never merges).
#   4. Zip ONLY the new image files and PUT the zip to the submission's
#      fileUploadUrl (Azure Blob SAS — self-authenticating). The unchanged
#      app package stays fileStatus=Uploaded and is not re-uploaded.
#   5. POST /commit, then poll /status until it leaves CommitStarted.
#
# Do not run while another submission is in flight (e.g. a release in
# certification) — one submission pipeline per app.
on:
  workflow_dispatch:
    inputs:
      listing_language:
        description: 'Listing language key to update'
        required: false
        default: 'en-us'

permissions:
  contents: read

env:
  APP_ID: 9NJ59RH053PV

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace screenshots via the Store submission REST API
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          LISTING_LANG: ${{ github.event.inputs.listing_language }}
        run: |
          set -euo pipefail
          lang="${LISTING_LANG:-en-us}"
          shots_dir="store-assets/screenshots"

          mapfile -t files < <(find "$shots_dir" -maxdepth 1 -name '*.png' -printf '%f\n' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No PNG files in $shots_dir"; exit 1
          fi
          echo "Uploading ${#files[@]} screenshot(s): ${files[*]}"

          # ---- Auth (same proven pattern as check-store-submission.yml) ----
          token_response="$(curl -sS --max-time 60 -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${AZURE_CLIENT_ID}" \
            -d "client_secret=${AZURE_CLIENT_SECRET}" \
            -d "resource=https://manage.devcenter.microsoft.com")"
          token="$(echo "$token_response" | jq -r '.access_token // empty')"
          if [ -z "$token" ]; then
            echo "::error::Failed to get Partner Center access token"
            echo "$token_response" | jq '{error, error_description}'
            exit 1
          fi
          echo "::add-mask::$token"
          base="https://manage.devcenter.microsoft.com/v1.0/my/applications/${APP_ID}"

          # ---- API helper: real error bodies + retry with backoff on
          # transient failures (Partner Center 504s freely, and rate-limits) ----
          api() {
            local method="$1" url="$2" body_file="${3:-}"
            local attempt code
            for attempt in 1 2 3 4 5; do
              if [ -n "$body_file" ]; then
                code=$(curl -sS --max-time 180 -o /tmp/api_resp.json -w '%{http_code}' \
                  -X "$method" "$url" \
                  -H "Authorization: Bearer $token" \
                  -H "Content-Type: application/json" \
                  --data @"$body_file") || code="000"
              elif [ "$method" = "GET" ]; then
                code=$(curl -sS --max-time 180 -o /tmp/api_resp.json -w '%{http_code}' \
                  -X "$method" "$url" \
                  -H "Authorization: Bearer $token") || code="000"
              else
                # Bodyless POST: the API returns 411 unless Content-Length is
                # sent; --data '' makes curl send Content-Length: 0
                code=$(curl -sS --max-time 180 -o /tmp/api_resp.json -w '%{http_code}' \
                  -X "$method" "$url" \
                  -H "Authorization: Bearer $token" \
                  -H "Content-Type: application/json" \
                  --data '') || code="000"
              fi
              if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ]; then
                cat /tmp/api_resp.json
                return 0
              fi
              echo "::warning::$method $url -> HTTP $code (attempt $attempt/5)" >&2
              head -c 600 /tmp/api_resp.json >&2 || true; echo >&2
              case "$code" in
                429) sleep 90 ;;
                5*|000) sleep 45 ;;
                *) return 1 ;;   # 4xx other than 429: not transient, fail now
              esac
            done
            return 1
          }

          # ---- 1. Pending submission or create one ----
          app_json="$(api GET "$base")"
          pending_id="$(echo "$app_json" | jq -r '.pendingApplicationSubmission.id // empty')"
          if [ -n "$pending_id" ]; then
            echo "Using existing pending submission: $pending_id"
            sub_json="$(api GET "$base/submissions/$pending_id")"
          else
            echo "No pending submission — creating one (clone of last published)."
            sub_json="$(api POST "$base/submissions")"
          fi
          sub_id="$(echo "$sub_json" | jq -r '.id')"
          sub_status="$(echo "$sub_json" | jq -r '.status // empty')"
          upload_url="$(echo "$sub_json" | jq -r '.fileUploadUrl // empty')"
          echo "Submission $sub_id status: $sub_status"
          if [ "$sub_status" != "PendingCommit" ]; then
            echo "::error::Submission $sub_id is '$sub_status', not editable (a release may be in certification). Try again after it publishes."
            exit 1
          fi
          if [ -z "$upload_url" ]; then
            echo "::error::Submission has no fileUploadUrl"; exit 1
          fi

          # ---- 2. Patch the images array ----
          echo "Existing images on '$lang':"
          echo "$sub_json" | jq -r --arg l "$lang" '.listings[$l].baseListing.images[]? | "  [\(.imageType)] \(.fileName // .id) (\(.fileStatus))"'
          if ! echo "$sub_json" | jq -e --arg l "$lang" '.listings[$l]' > /dev/null; then
            echo "::error::Listing '$lang' not found. Available: $(echo "$sub_json" | jq -r '.listings | keys | join(", ")')"
            exit 1
          fi
          new_images="$(printf '%s\n' "${files[@]}" | jq -R '{fileName: ., fileStatus: "PendingUpload", imageType: "Screenshot"}' | jq -s '.')"
          echo "$sub_json" | jq --arg l "$lang" --argjson new "$new_images" '
            .listings[$l].baseListing.images =
              ([.listings[$l].baseListing.images[]? | select(.imageType != "Screenshot")] + $new)
          ' > /tmp/submission_patched.json
          echo "New images array:"
          jq -r --arg l "$lang" '.listings[$l].baseListing.images[] | "  [\(.imageType)] \(.fileName // .id) (\(.fileStatus))"' /tmp/submission_patched.json

          # ---- 3. PUT the full submission back ----
          api PUT "$base/submissions/$sub_id" /tmp/submission_patched.json > /tmp/put_resp.json
          echo "Submission updated."

          # ---- 4. Zip only the new images and upload to the blob SAS URL ----
          (cd "$shots_dir" && zip -q /tmp/images.zip "${files[@]}")
          echo "Zip: $(stat -c%s /tmp/images.zip) bytes"
          blob_code=$(curl -sS --max-time 600 -o /tmp/blob_resp.txt -w '%{http_code}' \
            -X PUT "$upload_url" \
            -H "x-ms-blob-type: BlockBlob" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/images.zip)
          if [ "$blob_code" != "201" ]; then
            echo "::error::Blob upload failed: HTTP $blob_code"; cat /tmp/blob_resp.txt; exit 1
          fi
          echo "Zip uploaded (HTTP 201)."

          # ---- 5. Commit and poll ----
          api POST "$base/submissions/$sub_id/commit" > /tmp/commit_resp.json
          echo "Committed: $(jq -r '.status // empty' /tmp/commit_resp.json)"

          for i in $(seq 1 20); do
            sleep 30
            status_json="$(api GET "$base/submissions/$sub_id/status")" || continue
            st="$(echo "$status_json" | jq -r '.status // empty')"
            echo "Poll $i: $st"
            case "$st" in
              CommitStarted) continue ;;
              CommitFailed)
                echo "::error::Commit failed:"
                echo "$status_json" | jq '.statusDetails'
                exit 1 ;;
              *)
                echo "Submission moved to '$st' — screenshots accepted, now in Store processing/certification."
                echo "$status_json" | jq '.statusDetails.warnings // empty'
                exit 0 ;;
            esac
          done
          echo "::warning::Still CommitStarted after 10 minutes — check Partner Center; commit was accepted."
