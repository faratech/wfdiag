name: Test Store Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to download artifacts from (leave empty for latest)'
        required: false

jobs:
  test-publish:
    runs-on: windows-latest
    steps:
      - name: Download bundle from previous run
        uses: actions/download-artifact@v4
        with:
          name: msixbundle-unsigned
          path: bundle
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find bundle file
        id: find-bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem "bundle/*.msixbundle" | Select-Object -First 1
          if (-not $bundle) {
            Write-Host "::error::No .msixbundle found in artifacts"
            exit 1
          }
          Write-Host "Found bundle: $($bundle.FullName)"
          echo "bundle_file=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
          echo "bundle_name=$($bundle.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload bundle to Azure Blob Storage
        id: upload-blob
        shell: pwsh
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrEmpty($env:AZURE_STORAGE_CONNECTION_STRING)) {
            Write-Host "::error::AZURE_STORAGE_CONNECTION_STRING secret not set"
            exit 1
          }

          az storage blob upload `
            --container-name packages `
            --file "${{ steps.find-bundle.outputs.bundle_file }}" `
            --name "${{ steps.find-bundle.outputs.bundle_name }}" `
            --overwrite

          $expiry = (Get-Date).AddHours(1).ToString("yyyy-MM-ddTHH:mm:ssZ")
          $sasUrl = az storage blob generate-sas `
            --container-name packages `
            --name "${{ steps.find-bundle.outputs.bundle_name }}" `
            --permissions r `
            --expiry $expiry `
            --full-uri `
            --output tsv

          echo "package_url=$sasUrl" >> $env:GITHUB_OUTPUT
          Write-Host "Package uploaded. SAS URL generated."

      - name: Configure Store credentials
        uses: microsoft/store-submission@v1
        with:
          command: configure
          type: win32
          seller-id: ${{ secrets.STORE_SELLER_ID }}
          product-id: ${{ secrets.STORE_PRODUCT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Update submission with package
        uses: microsoft/store-submission@v1
        with:
          command: update
          product-update: |
            {
              "packages": [{
                "packageUrl": "${{ steps.upload-blob.outputs.package_url }}",
                "languages": ["en"],
                "architectures": ["X64", "Arm64"]
              }]
            }

      - name: Publish to Microsoft Store
        uses: microsoft/store-submission@v1
        with:
          command: publish
