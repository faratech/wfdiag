[package]
name = "wfdiag"
version = "2.5.8"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
[[bin]]
name = "wfdiag"
path = "src/main.rs"

[features]
default = []
# Opt in only when validating a direct installer that carries the Windows App
# Runtime beside the executable. The default remains framework-dependent.
self-contained = []
# Enables the exact-path settings store used by integration validation. Never
# enable this feature for Store or direct-installer production artifacts.
settings-test-path = []

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
semver = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
wfdiag-native-ai-chat = { workspace = true }
wfdiag-native-ai-report = { workspace = true }
wfdiag-native-remediation = { workspace = true }
wfdiag-native-ai-provider = { workspace = true }
wfdiag-native-diagnostics = { workspace = true }
wfdiag-native-export = { workspace = true }
wfdiag-native-history = { workspace = true }
wfdiag-native-issues = { workspace = true }
wfdiag-native-monitor = { workspace = true }
wfdiag-native-phi = { workspace = true }
wfdiag-native-settings = { workspace = true }
wfdiag-native-system = { workspace = true }
wfdiag-native-update = { workspace = true }
wfdiag-ui-core = { workspace = true }
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Data_Xml_Dom",
    "Foundation_Collections",
    "Globalization_DateTimeFormatting",
    "System_UserProfile",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "UI_Notifications",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "1be5649497b59fe7cc2fb0ae5b0ebd7787327cc8" }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "1be5649497b59fe7cc2fb0ae5b0ebd7787327cc8" }

[build-dependencies]
serde_json = { workspace = true }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "1be5649497b59fe7cc2fb0ae5b0ebd7787327cc8" }
