[package]
name = "wfdiag-tauri"
version = "2.1.5"
description = "WindowsForum Diagnostic Tool"
authors = ["WindowsForum"]
edition = "2024"

[lib]
name = "wfdiag_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.9", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Tauri plugins for v2
tauri-plugin-fs = "2.4"
tauri-plugin-dialog = "2.4"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-process = "2.3"
tauri-plugin-shell = "2.3"
tokio = { version = "1.47", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.37"
scraper = "0.25"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.17", features = ["v4"] }
futures = "0.3"
async-openai = "0.30"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2.5"
warp = "0.4"
keyring = { version = "3.6", features = ["crypto-rust"] }
dirs = "6.0"
# Encryption dependencies
aes-gcm = "0.10"
pbkdf2 = "0.12"
zeroize = { version = "1.8", features = ["derive"] }


# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
wmi = "0.18"
winreg = "0.55"
windows-core = "0.62"
windows-future = "0.3"
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_Debug",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Services",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_NetworkManagement_WNet",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # DXCore for NPU detection
    "Win32_Graphics_DXCore",
    # WinRT for Phi Silica detection
    "Win32_System_WinRT",
    # Library loader for dynamic DLL loading (Phi Silica)
    "Win32_System_LibraryLoader",
    # Foundation for async operations
    "Foundation",
    # ApplicationModel for Limited Access Features (LAF)
    "ApplicationModel",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
