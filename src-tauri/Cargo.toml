[package]
name = "wfdiag-tauri"
version = "2.3.0"
description = "WindowsForum Diagnostic Tool"
authors = ["WindowsForum"]
edition = "2024"

[lib]
name = "wfdiag_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri app binary (runs from lib.rs)
[[bin]]
name = "wfdiag-tauri"
path = "src/main_tauri.rs"

# Debug diagnostics binary
[[bin]]
name = "debug_diagnostics"
path = "src/bin/debug_diagnostics.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2.11", features = [] }

# Tauri v2 plugins
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-shell = "2.3"
tauri-plugin-notification = "2"

# Date/time utilities
chrono = "0.4"

# Async runtime
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
uuid = { version = "1.20.0", features = ["v4"] }
rand = "0.9"
base64 = "0.22"
url = "2.5"
dirs = "6.0"

# OpenAI integration - using Responses API
async-openai = { version = "0.32", default-features = false, features = ["native-tls", "responses"] }
keyring = "3.6"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
encoding_rs = "0.8"
windows-core = "0.62"
windows-future = "0.3"
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_TaskScheduler",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_DXCore",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "Management_Deployment",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.dev]
opt-level = 1
