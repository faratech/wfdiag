[package]
name = "wfdiag-tauri"
version = "2.5.8"
description = "WindowsForum Diagnostic Tool"
authors = ["WindowsForum"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "wfdiag_tauri"
# rlib only: the mobile-only cdylib/staticlib outputs would otherwise land in
# the shared workspace target directory next to the native shell executable.
crate-type = ["rlib"]

# Tauri app binary (runs from lib.rs)
[[bin]]
name = "wfdiag-tauri"
path = "src/main_tauri.rs"

# Debug diagnostics binary
[[bin]]
name = "debug_diagnostics"
path = "src/bin/debug_diagnostics.rs"

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2.11", features = ["tray-icon"] }

# Tauri v2 plugins
tauri-plugin-dialog = "2.7"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.2"

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
futures = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Utilities
anyhow = { workspace = true }
# Already in the tree transitively (async-openai, tauri) — direct use for the
# MCP bridge and native AI provider clients.
reqwest = { workspace = true, features = ["json", "native-tls", "stream"] }
# CancellationToken for stoppable AI chat turns
tokio-util = { workspace = true, features = ["compat"] }
uuid = { workspace = true, features = ["v4"] }
url = { workspace = true }
dirs = { workspace = true }
wfdiag-ui-core = { workspace = true }
wfdiag-native-core = { workspace = true }
wfdiag-native-diagnostics = { workspace = true }
wfdiag-native-export = { workspace = true }
wfdiag-native-history = { workspace = true }
wfdiag-native-issues = { workspace = true }
wfdiag-native-monitor = { workspace = true }
wfdiag-native-ai-analysis = { workspace = true }
wfdiag-native-ai-provider = { workspace = true }
wfdiag-native-ai-chat = { workspace = true }
wfdiag-native-ai-report = { workspace = true }
wfdiag-native-phi = { workspace = true }
wfdiag-native-settings = { workspace = true }
wfdiag-native-system = { workspace = true }
wfdiag-native-update = { workspace = true }
wfdiag-native-remediation = { workspace = true }

# OpenAI integration — Responses API for cloud OpenAI/Foundry Local one-shot,
# chat-completion for the generic OpenAI-compatible providers (OpenRouter,
# Ollama, Groq, …) which do not serve /v1/responses
async-openai = { workspace = true, features = ["native-tls", "responses", "chat-completion"] }
# Non-Windows secure storage fallback. Windows builds use DPAPI instead.
[target.'cfg(not(windows))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
encoding_rs = { workspace = true }
windows-core = "0.62"
windows-future = "0.3"
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_EventLog",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_TaskScheduler",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_Graphics_Direct3D",
    "Wdk_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_DXCore",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_Storage_Packaging_Appx",
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "Management_Deployment",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
