[package]
name = "wfdiag-tauri"
version = "2.0.8"
description = "WindowsForum Diagnostic Tool"
authors = ["WindowsForum"]
edition = "2024"

[lib]
name = "wfdiag_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Tauri plugins for v2
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
chrono = "0.4"
sysinfo = "0.36"
scraper = "0.21"
regex = "1.11"
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
uuid = { version = "1.18", features = ["v4"] }
futures = "0.3"
open = "5"
async-openai = "0.25"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2.5"
warp = "0.3"
keyring = { version = "3.6", default-features = false, features = ["linux-native", "windows-native"] }
# Encryption dependencies
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
zeroize = { version = "1.8", features = ["derive"] }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
wmi = "0.17"
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security", 
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_Debug",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Services",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_NetworkManagement_WNet",
    "Win32_System_Wmi",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
