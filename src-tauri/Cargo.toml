[package]
name = "wfdiag-tauri"
version = "2.1.7"
description = "WindowsForum Diagnostic Tool"
authors = ["WindowsForum"]
edition = "2024"

[lib]
name = "wfdiag_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "debug_diagnostics"
path = "src/bin/debug_diagnostics.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.9", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Tauri plugins for v2
tauri-plugin-fs = "2.4"
tauri-plugin-dialog = "2.4"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-shell = "2.3"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1.0"
uuid = { version = "1.17", features = ["v4"] }
futures = "0.3"
async-openai = { version = "0.30", default-features = false, features = ["native-tls"] }
rand = "0.9"
base64 = "0.22"
url = "2.5"
keyring = "3.6"
dirs = "6.0"


# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-core = "0.62"
windows-future = "0.3"
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_TaskScheduler",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_DXCore",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "Management_Deployment",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
